<script>
// Supabaseライブラリの読み込みに失敗した場合に、画面が反応しないように見える問題を防ぐ
window.addEventListener("error", function(e){
  var box = document.getElementById("authErr");
  if(box && !box.textContent){
    box.textContent = "エラーが発生しました： " + (e.message || "不明なエラー");
  }
});
if(typeof supabase === "undefined"){
  document.getElementById("authErr").textContent = "通信ライブラリの読み込みに失敗しました。ネットワーク接続（または広告ブロッカー等の拡張機能）をご確認のうえ、ページを再読み込みしてください。";
  document.getElementById("authSubmit").disabled = true;
}
function togglePasswordVisibility(){
  const input = document.getElementById("authPassword");
  const btn = document.getElementById("togglePasswordBtn");
  const isHidden = input.type === "password";
  input.type = isHidden ? "text" : "password";
  btn.textContent = isHidden ? "🙈" : "👁";
}
const refFromUrl = new URLSearchParams(window.location.search).get("ref");
if(refFromUrl){
  document.getElementById("authReferral").value = refFromUrl.toUpperCase();
}

function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
async function compressImage(file, targetBytes){
  const bitmap = await createImageBitmap(file);
  let width = bitmap.width, height = bitmap.height;
  let dimension = 480;
  let quality = 0.8;
  let blob = null;
  for(let attempt = 0; attempt < 8; attempt++){
    const scale = Math.min(1, dimension / Math.max(width, height));
    const canvas = document.createElement("canvas");
    canvas.width = Math.max(1, Math.round(width * scale));
    canvas.height = Math.max(1, Math.round(height * scale));
    const ctx = canvas.getContext("2d");
    ctx.drawImage(bitmap, 0, 0, canvas.width, canvas.height);
    blob = await new Promise(resolve => canvas.toBlob(resolve, "image/jpeg", quality));
    if(!blob) break;
    if(blob.size <= targetBytes) break;
    // 目標サイズを超えていたら、画質を下げつつサイズも縮小して再挑戦
    quality = Math.max(0.4, quality - 0.1);
    dimension = Math.max(120, Math.round(dimension * 0.85));
  }
  return blob;
}

/* ---------- Notification Settings ---------- */
function isBrowserNotifyEnabled(){
  return localStorage.getItem("connect_notify_browser") === "1" && Notification.permission === "granted";
}
function setupNotifyToggle(){
  const btn = document.getElementById("notifyToggleBtn");
  const statusBox = document.getElementById("notifySettingStatus");
  function render(){
    if(!("Notification" in window)){
      btn.textContent = "このブラウザは通知に対応していません";
      btn.disabled = true;
      return;
    }
    if(Notification.permission === "denied"){
      btn.textContent = "通知がブロックされています（ブラウザ設定から許可してください）";
      btn.disabled = true;
      return;
    }
    const enabled = isBrowserNotifyEnabled();
    btn.textContent = enabled ? "通知をオフにする" : "通知をオンにする";
    btn.className = enabled ? "" : "primary";
    statusBox.style.display = enabled ? "block" : "none";
    if(enabled) statusBox.textContent = "通知はオンになっています。メッセージが届くとお知らせします。";
  }
  btn.onclick = async () => {
    if(isBrowserNotifyEnabled()){
      localStorage.setItem("connect_notify_browser", "0");
      render();
      return;
    }
    const permission = await Notification.requestPermission();
    if(permission === "granted"){
      localStorage.setItem("connect_notify_browser", "1");
      new Notification("CONNECT", { body: "通知をオンにしました。メッセージが届くとお知らせします。" });
    }
    render();
  };
  render();
}

function isSoundEnabled(){
  return localStorage.getItem("connect_notify_sound") === "1";
}
function setupSoundToggle(){
  const btn = document.getElementById("soundToggleBtn");
  function render(){
    const enabled = isSoundEnabled();
    btn.textContent = enabled ? "通知音をオフにする" : "通知音をオンにする";
    btn.className = enabled ? "" : "primary";
  }
  btn.onclick = () => {
    const enabled = isSoundEnabled();
    localStorage.setItem("connect_notify_sound", enabled ? "0" : "1");
    if(!enabled) playNotifySound();
    render();
  };
  render();
}
function playNotifySound(){
  try{
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.type = "sine";
    o.frequency.setValueAtTime(880, ctx.currentTime);
    g.gain.setValueAtTime(0.15, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.4);
    o.connect(g); g.connect(ctx.destination);
    o.start();
    o.stop(ctx.currentTime + 0.4);
  }catch(e){}
}

const ORIGINAL_TITLE = document.title;
function updateBadgeDisplay(count){
  document.title = count > 0 ? `(${count}) ${ORIGINAL_TITLE}` : ORIGINAL_TITLE;

function drawFaviconBadge(count){
  const canvas = document.createElement("canvas");
  canvas.width = 64; canvas.height = 64;
  const ctx = canvas.getContext("2d");
  ctx.fillStyle = "#111827";
  ctx.beginPath(); ctx.arc(32, 32, 30, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = "white";
  ctx.font = "bold 34px sans-serif";
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillText("C", 32, 34);
  if(count > 0){
    ctx.fillStyle = "#dc2626";
    ctx.beginPath(); ctx.arc(48, 16, 15, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = "white";
    ctx.font = "bold 18px sans-serif";
    ctx.fillText(count > 99 ? "99+" : String(count), 48, 17);
  }
  let link = document.querySelector("link[rel~='icon']");
  if(!link){ link = document.createElement("link"); link.rel = "icon"; document.head.appendChild(link); }
  link.href = canvas.toDataURL("image/png");
}

          <option value="industry" ${discoverState.sort==="industry"?"selected":""}>業種順</option>

        </select>

async function discover(){
  document.getElementById("main").innerHTML = discoverFilterBar();
  document.getElementById("dfPref").addEventListener("change", (e) => {
    discoverState.prefecture = e.target.value;
    discoverState.city = "";
    discover();
  });
  document.getElementById("dfSearchBtn").addEventListener("click", () => {
    discoverState.industry = document.getElementById("dfIndustry").value;
    discoverState.city = document.getElementById("dfCity").value;
    discoverState.sort = document.getElementById("dfSort").value;
    discoverState.keyword = document.getElementById("dfKeyword").value.trim();
    discover();
  });
  await runDiscoverSearch();

async function runDiscoverSearch(){
  const excluded = await getExcludedIds();
  let query = sb.from("profiles").select("*");
  if(!isGuest) query = query.neq("id", currentUser.id);
  if(excluded.length) query = query.not("id", "in", `(${excluded.join(",")})`);
  if(discoverState.industry) query = query.ilike("type", `%${discoverState.industry}%`);
  if(discoverState.prefecture) query = query.eq("prefecture", discoverState.prefecture);
  if(discoverState.city) query = query.eq("city", discoverState.city);
  if(discoverState.keyword){
    const kw = discoverState.keyword;
    query = query.or(`name.ilike.%${kw}%,type.ilike.%${kw}%,can_do.ilike.%${kw}%,want.ilike.%${kw}%,bio.ilike.%${kw}%`);
  }
  const { data: list, error } = await query;
  const el = document.getElementById("discoverList");
  if(error){ el.innerHTML = `<p class="muted">検索に失敗しました。</p>`; return; }
  const sorted = sortProfiles(list || [], discoverState.sort);
  el.innerHTML = sorted.length ? sorted.map(discoverCardHTML).join("") : `<p class="muted">該当するユーザーが見つかりませんでした。</p>`;
}
function sortProfiles(list, sort){
  const prefIndex = p => { const i = PREFECTURES.indexOf(p); return i === -1 ? 999 : i; };
  const arr = list.slice();
  if(sort === "new") arr.sort((a,b) => new Date(b.created_at) - new Date(a.created_at));
  else if(sort === "prefecture") arr.sort((a,b) => prefIndex(a.prefecture) - prefIndex(b.prefecture) || (a.city||"").localeCompare(b.city||"", "ja"));
  else if(sort === "industry") arr.sort((a,b) => (a.type||"").localeCompare(b.type||"", "ja"));
  else if(sort === "city") arr.sort((a,b) => (a.city||"").localeCompare(b.city||"", "ja"));
  else arr.sort((a,b) => (b.subscribed - a.subscribed) || (new Date(b.created_at) - new Date(a.created_at))); // おすすめ順：会員優先→新着
  return arr;
}
function truncateText(text, maxLen){
  const t = String(text || "");
  return t.length > maxLen ? t.slice(0, maxLen) + "…" : t;
}
function discoverCardHTML(u){
  const breadcrumb = [u.prefecture, u.city, u.type].filter(Boolean).join(" → ") || "地域・業種未設定";
  return `<div class="listrow" onclick="openProfile('${u.id}')" style="cursor:pointer">

      <div class="muted">${esc(breadcrumb)}</div>

      <div class="row" style="margin-top:6px;flex-wrap:nowrap" onclick="event.stopPropagation()">

async function sendChatImage(otherId, file){
  if(isGuest) return promptLogin();
  if(!canSendMessages()) return promptSubscribe();
  if(!file) return;
  const fileInput = document.getElementById("chatImageInput");
  const camBtn = fileInput?.previousElementSibling;
  try{
    if(camBtn) camBtn.textContent = "…";
    const compressed = await compressImage(file, 400*1024);
    if(!compressed){ alert("画像の処理に失敗しました。別の画像でお試しください。"); return; }
    const path = `${currentUser.id}/${otherId}/${Date.now()}.jpg`;
    const { error: upErr } = await sb.storage.from("chat-images").upload(path, compressed, { contentType: "image/jpeg" });
    if(upErr){ alert("画像のアップロードに失敗しました。"); return; }
    const { data: pub } = sb.storage.from("chat-images").getPublicUrl(path);
    const { error } = await sb.from("messages").insert({ from_user: currentUser.id, to_user: otherId, body: "", image_url: pub.publicUrl });
    if(error){ alert("画像を送信できませんでした。相手をブロックしているか、相手にブロックされている可能性があります。"); return; }
    await sb.from("notifications").insert({ user_id: otherId, body: `${myProfile.name||"誰か"}さんから写真が届きました` });
    await renderChatMessages(otherId);
  } finally {
    if(fileInput) fileInput.value = "";
    if(camBtn) camBtn.textContent = "📷";
  }
}

async function adminPage(){

  const since = new Date(Date.now() - 14*86400000).toISOString();
  const { data: recentUsers } = await sb.from("profiles").select("created_at").gte("created_at", since);
  const growthEl = document.getElementById("adminGrowth");
  const dayCounts = {};
  for(let i=13;i>=0;i--){
    const d = new Date(Date.now() - i*86400000);
    const key = d.toISOString().slice(0,10);
    dayCounts[key] = 0;
  }
  (recentUsers||[]).forEach(u => {
    const key = new Date(u.created_at).toISOString().slice(0,10);
    if(key in dayCounts) dayCounts[key]++;
  });

  growthEl.innerHTML = Object.entries(dayCounts).map(([day, count]) => {
    const label = day.slice(5).replace("-", "/");
    const widthPct = Math.round((count / maxCount) * 100);
    return `<div class="row" style="gap:8px;margin:3px 0"><span class="small muted" style="width:44px;flex-shrink:0">${label}</span><div style="flex:1;background:#f3f4f6;border-radius:4px;overflow:hidden"><div style="width:${widthPct}%;background:#111827;height:16px;border-radius:4px"></div></div><span class="small" style="width:24px;text-align:right">${count}</span></div>`;
  }).join("");

  const { data: reports, error: repErr } = await sb.from("reports")
    .select("*, reporter:profiles!reports_reporter_id_fkey(name), target:profiles!reports_target_user_id_fkey(id,name)")
    .eq("status", "open")
    .order("created_at", { ascending: false });
  const repEl = document.getElementById("adminReports");
  if(repErr){ repEl.innerHTML = `<p class="muted">通報の読み込みに失敗しました。</p>`; }
  else {
    repEl.innerHTML = reports.length ? reports.map(r => `
      <div class="post">

        <p><b>理由：</b>${esc(r.reason)}</p>
        ${r.target ? `<div class="card">対象ユーザー：${esc(r.target.name)}</div>` : ""}
        <div class="actions">
          ${r.target ? `<button class="danger" onclick="adminSuspendUser('${r.target.id}', true, '${r.id}')">ユーザーを利用停止</button>` : ""}
          <button onclick="adminResolveReport('${r.id}', 'dismissed')">問題なしとして却下</button>
        </div>
      </div>`).join("") : `<p class="muted">未対応の通報はありません。</p>`;
  }

  const { data: users, error: userErr } = await sb.from("profiles").select("*").order("created_at", { ascending: false });
  const userEl = document.getElementById("adminUsers");
  if(userErr){ userEl.innerHTML = `<p class="muted">ユーザー一覧の読み込みに失敗しました。</p>`; }
  else {
    userEl.innerHTML = users.map(u => `
      <div class="post"><div class="row between">
        <div class="row">${avatarHTML(u, 42)}<div><b>${esc(u.name)||"(未設定)"}</b><div class="muted">${esc(locLabel(u))} ・ ${esc(u.type)} ${u.is_admin?'・<span class="pill">管理者</span>':''} ${u.is_verified?'・<span class="pill" style="background:#dcfce7;color:#166534">✓認証済み</span>':''} ${u.suspended?'・<span class="pill" style="background:#fee2e2;color:#991b1b">利用停止中</span>':''}</div></div></div>
        <div class="row">
          ${u.is_admin ? "" : `<button onclick="adminToggleVerified('${u.id}', ${!u.is_verified})">${u.is_verified?"認証解除":"認証バッジ付与"}</button>`}
          ${u.is_admin ? "" : `<button class="${u.suspended?'':'danger'}" onclick="adminSuspendUser('${u.id}', ${!u.suspended})">${u.suspended?"利用停止を解除":"利用停止にする"}</button>`}
        </div>
      </div></div>`).join("");
  }

function setupSlideToCall(peerId, peerName){
  const track = document.getElementById("slideTrack");
  const handle = document.getElementById("slideHandle");
  const fill = document.getElementById("slideFill");
  const label = document.getElementById("slideLabel");
  let dragging = false;
  let startX = 0;
  let maxX = 0;
  function setPos(x){
    const clamped = Math.max(0, Math.min(maxX, x));
    handle.style.left = clamped + "px";
    fill.style.width = (clamped + 56) + "px";
    label.style.opacity = String(1 - clamped / maxX * 0.8);
  }
  function onDown(e){
    dragging = true;
    startX = (e.touches ? e.touches[0].clientX : e.clientX) - handle.offsetLeft;
    maxX = track.clientWidth - 56;
    handle.style.cursor = "grabbing";
  }
  function onMove(e){
    if(!dragging) return;
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    setPos(clientX - startX);
  }
  function onUp(){
    if(!dragging) return;
    dragging = false;
    handle.style.cursor = "grab";
    const pos = handle.offsetLeft;
    if(pos >= maxX * 0.85){
      setPos(maxX);
      closeModal();
      const audioElUnlock = document.getElementById("remoteAudio");
      audioElUnlock.muted = false;
      audioElUnlock.play().catch(() => {});
      startCall(peerId, peerName);
    } else {
      setPos(0);
    }
  }
  handle.addEventListener("mousedown", onDown);
  handle.addEventListener("touchstart", onDown, { passive: true });
  window.addEventListener("mousemove", onMove);
  window.addEventListener("touchmove", onMove, { passive: true });
  window.addEventListener("mouseup", onUp);
  window.addEventListener("touchend", onUp);
}

let pc = null;
let localStream = null;
let myCallChannel = null;
let outgoingCallChannel = null;
let currentCallPeerId = null;
let currentCallPeerName = null;
let currentCallId = null;
let isMuted = false;
let ringtoneCtx = null;
let ringtoneInterval = null;

function startRingtone(){
  stopRingtone();
  try{
    ringtoneCtx = new (window.AudioContext || window.webkitAudioContext)();
    const playPulse = () => {
      if(!ringtoneCtx) return;
      [660, 880].forEach((freq, i) => {
        const o = ringtoneCtx.createOscillator();
        const g = ringtoneCtx.createGain();
        o.type = "sine";
        o.frequency.value = freq;
        const startAt = ringtoneCtx.currentTime + i * 0.35;
        g.gain.setValueAtTime(0.0001, startAt);
        g.gain.exponentialRampToValueAtTime(0.2, startAt + 0.05);
        g.gain.exponentialRampToValueAtTime(0.0001, startAt + 0.3);
        o.connect(g); g.connect(ringtoneCtx.destination);
        o.start(startAt); o.stop(startAt + 0.32);
      });
    };
    playPulse();
    ringtoneInterval = setInterval(playPulse, 1800);
  }catch(e){}
}
function stopRingtone(){
  if(ringtoneInterval){ clearInterval(ringtoneInterval); ringtoneInterval = null; }
  if(ringtoneCtx){ ringtoneCtx.close().catch(()=>{}); ringtoneCtx = null; }
}

async function startCall(peerId, peerName){
  if(pc){ alert("すでに通話中です。"); return; }
  if(!navigator.mediaDevices?.getUserMedia){ alert("お使いのブラウザは通話機能に対応していません。"); return; }
  const { data: peerProfile } = await sb.from("profiles").select("calls_enabled").eq("id", peerId).single();
  if(peerProfile && peerProfile.calls_enabled === false){ alert(`${peerName}さんは通話機能をオフにしています。`); return; }
  currentCallPeerId = peerId;
  currentCallPeerName = peerName;
  currentCallId = (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()));
  try{
    localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
  }catch(e){
    alert("マイクにアクセスできませんでした。ブラウザの権限設定をご確認ください。");
    resetCallState();
    return;
  }
  pc = new RTCPeerConnection({ iceServers: await getIceServers() });
  localStream.getTracks().forEach(t => pc.addTrack(t, localStream));
  pc.onicecandidate = (e) => {
    if(e.candidate) getOutgoingChannel(peerId).send({ type: "broadcast", event: "ice-candidate", payload: { callId: currentCallId, candidate: e.candidate, from: currentUser.id } });
  };
  pc.ontrack = (e) => { attachRemoteStream(e.streams[0]); };
  const onStateChange = () => {
    if(!pc) return;
    const state = pc.connectionState;
    if(["connected"].includes(state)){ stopRingtone(); clearCallTimeout(); document.getElementById("activeCallStatus").textContent = "通話中"; }
    if(["failed","closed"].includes(state)) endCall(false);
    if(state === "disconnected"){
      // 瞬断の可能性があるので少し待ってから本当に切れたか確認する
      setTimeout(() => { if(pc && pc.connectionState === "disconnected") endCall(false); }, 6000);
    }
  };
  pc.onconnectionstatechange = onStateChange;
  pc.oniceconnectionstatechange = onStateChange;
  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);
  getOutgoingChannel(peerId).send({ type: "broadcast", event: "call-offer", payload: { callId: currentCallId, offer, from: currentUser.id, fromName: myProfile.name || "誰か" } });
  showActiveCallUI(peerName, "発信中…");
  startRingtone();
  startCallTimeout(() => { showToast("応答がありませんでした"); endCall(true); }, 45000);
}
let pendingOffer = null;
function handleIncomingOffer(payload){
  if(myProfile && myProfile.calls_enabled === false){
    sb.channel(`calls:${payload.from}`).subscribe((status) => {
      if(status === "SUBSCRIBED") sb.channel(`calls:${payload.from}`).send({ type: "broadcast", event: "call-end", payload: { callId: payload.callId, reason: "off" } });
    });
    return;
  }
  if(pc || pendingOffer){
    // 通話中・他の着信対応中は自動的にビジー扱いにする
    sb.channel(`calls:${payload.from}`).subscribe((status) => {
      if(status === "SUBSCRIBED") sb.channel(`calls:${payload.from}`).send({ type: "broadcast", event: "call-end", payload: { callId: payload.callId, reason: "busy" } });
    });
    return;
  }
  pendingOffer = payload;
  document.getElementById("incomingCallerName").textContent = payload.fromName || "誰か";
  document.getElementById("incomingCallBanner").classList.remove("hidden");
  setupAnswerSlide();
  startRingtone();
  startCallTimeout(() => {
    document.getElementById("incomingCallBanner").classList.add("hidden");
    if(pendingOffer) getOutgoingChannel(pendingOffer.from).send({ type: "broadcast", event: "call-end", payload: { callId: pendingOffer.callId, reason: "declined" } });
    pendingOffer = null;
    stopRingtone();
  }, 45000);
}

  currentCallId = payload.callId;

    localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
  }catch(e){
    alert("マイクにアクセスできませんでした。");
    getOutgoingChannel(payload.from).send({ type: "broadcast", event: "call-end", payload: { callId: payload.callId, reason: "declined" } });
    resetCallState();
    return;
  }
  pc = new RTCPeerConnection({ iceServers: await getIceServers() });
  localStream.getTracks().forEach(t => pc.addTrack(t, localStream));
  pc.onicecandidate = (e) => {
    if(e.candidate) getOutgoingChannel(payload.from).send({ type: "broadcast", event: "ice-candidate", payload: { callId: currentCallId, candidate: e.candidate, from: currentUser.id } });
  };
  pc.ontrack = (e) => { attachRemoteStream(e.streams[0]); };
  const onStateChange = () => {
    if(!pc) return;
    const state = pc.connectionState;
    if(state === "connected"){ clearCallTimeout(); document.getElementById("activeCallStatus").textContent = "通話中"; }
    if(["failed","closed"].includes(state)) endCall(false);
    if(state === "disconnected"){
      setTimeout(() => { if(pc && pc.connectionState === "disconnected") endCall(false); }, 6000);
    }
  };
  pc.onconnectionstatechange = onStateChange;
  pc.oniceconnectionstatechange = onStateChange;
  await pc.setRemoteDescription(new RTCSessionDescription(payload.offer));

  const answer = await pc.createAnswer();

  getOutgoingChannel(payload.from).send({ type: "broadcast", event: "call-answer", payload: { callId: currentCallId, answer, from: currentUser.id } });

  pendingOffer = null;
  document.getElementById("incomingCallBanner").classList.add("hidden");
  getOutgoingChannel(from).send({ type: "broadcast", event: "call-end", payload: { callId, reason: "declined" } });
}
async function handleAnswer(payload){
  if(!pc || payload.callId !== currentCallId) return;
  stopRingtone();
  await pc.setRemoteDescription(new RTCSessionDescription(payload.answer));
  document.getElementById("activeCallStatus").textContent = "接続中…";
  startCallTimeout(() => { showToast("接続できませんでした"); endCall(true); }, 30000);
  await flushPendingIceCandidates();
}
let pendingIceCandidates = [];
async function handleRemoteIce(payload){
  if(pc && payload.callId === currentCallId && pc.remoteDescription){
    try{ await pc.addIceCandidate(new RTCIceCandidate(payload.candidate)); }catch(e){}
    return;
  }
  // まだ電話に出ていない・接続準備が整っていない場合は、情報を一旦保留しておく
  pendingIceCandidates.push(payload);
  if(pendingIceCandidates.length > 100) pendingIceCandidates.shift();
}
async function flushPendingIceCandidates(){
  if(!pc || !currentCallId || !pc.remoteDescription) return;
  const toApply = pendingIceCandidates.filter(p => p.callId === currentCallId);
  pendingIceCandidates = pendingIceCandidates.filter(p => p.callId !== currentCallId);
  for(const payload of toApply){
    try{ await pc.addIceCandidate(new RTCIceCandidate(payload.candidate)); }catch(e){}
  }
}
function handleRemoteEnd(payload){
  if(payload.callId !== currentCallId && pendingOffer?.callId !== payload.callId) return;
  clearCallTimeout();
  stopRingtone();
  if(pendingOffer && pendingOffer.callId === payload.callId){
    pendingOffer = null;
    document.getElementById("incomingCallBanner").classList.add("hidden");
    return;
  }
  const messages = { declined: "相手が応答しませんでした", busy: "相手は通話中です", off: "相手は通話機能をオフにしています" };
  showToast(messages[payload.reason] || "通話が終了しました");
  endCall(false);
}
function resetCallState(){
  clearCallTimeout();
  stopRingtone();
  pendingOffer = null;
  pendingIceCandidates = [];
  document.getElementById("incomingCallBanner").classList.add("hidden");
  if(answerSlideCleanup) answerSlideCleanup();
  if(localStream){ try{ localStream.getTracks().forEach(t => t.stop()); }catch(e){} localStream = null; }
  if(pc){ try{ pc.close(); }catch(e){} pc = null; }
  if(outgoingCallChannel){
    const chToClose = outgoingCallChannel;
    outgoingCallChannel = null;
    outgoingCallChannelPeerId = null;
    setTimeout(() => chToClose.unsubscribe(), 500);
  }
  const remoteAudioEl = document.getElementById("remoteAudio");
  if(remoteAudioEl) remoteAudioEl.srcObject = null;
  document.getElementById("activeCallBar").classList.add("hidden");
  currentCallPeerId = null; currentCallPeerName = null; currentCallId = null; isMuted = false;
  document.getElementById("muteCallBtn").textContent = "🎤";
}
async function endCall(notifyPeer){
  clearCallTimeout();
  stopRingtone();
  if(notifyPeer && currentCallPeerId){
    try{
      await getOutgoingChannel(currentCallPeerId).send({ type: "broadcast", event: "call-end", payload: { callId: currentCallId, reason: "ended" } });
    }catch(e){}
  }
  resetCallState();
}
function toggleMute(){
  if(!localStream) return;
  isMuted = !isMuted;
  localStream.getAudioTracks().forEach(t => t.enabled = !isMuted);
  document.getElementById("muteCallBtn").textContent = isMuted ? "🔇" : "🎤";
}
function setCallVolume(v){
  document.getElementById("remoteAudio").volume = Number(v);
}
function attachRemoteStream(stream){
  const audioEl = document.getElementById("remoteAudio");
  audioEl.srcObject = stream;
  audioEl.muted = false;
  const playPromise = audioEl.play();
  if(playPromise && playPromise.catch){
    playPromise.catch(() => {
      // 自動再生がブロックされた場合、通話中バーのタップで再生を試みられるようにする
      showToast("音声を再生するには画面をタップしてください");
    });
  }
}
function retryRemoteAudioPlayback(){
  const audioEl = document.getElementById("remoteAudio");
  if(audioEl.srcObject) audioEl.play().catch(() => {});
}
function showActiveCallUI(peerName, status){
  document.getElementById("activeCallName").textContent = peerName;
  document.getElementById("activeCallStatus").textContent = status;
  document.getElementById("activeCallBar").classList.remove("hidden");
}

function setupRealtime(){
  if(realtimeChannel) return;
  realtimeChannel = sb.channel("connect-realtime")
    .on("postgres_changes", { event: "INSERT", schema: "public", table: "messages" }, (payload) => {
      const m = payload.new;
      if(m.from_user !== currentUser.id && m.to_user !== currentUser.id) return;
      const activePage = document.querySelector('#tabbar .active')?.dataset.page;
      if(activePage === "messages"){
        if(currentChatPeerId && (currentChatPeerId === m.from_user || currentChatPeerId === m.to_user)){
          renderChatMessages(currentChatPeerId);
        } else {
          messagePage();
        }
      }
      if(activePage === "home" && m.to_user === currentUser.id) home();
      refreshMessageBadge();
      if(m.to_user === currentUser.id && isSoundEnabled()) playNotifySound();
    })
    .on("postgres_changes", { event: "INSERT", schema: "public", table: "notifications", filter: `user_id=eq.${currentUser.id}` }, (payload) => {
      const activePage = document.querySelector('#tabbar .active')?.dataset.page;
      if(activePage === "notifications") notificationPage();
      showToast("新しい通知が届きました");
      if(isBrowserNotifyEnabled()){
        try{ new Notification("CONNECT", { body: payload.new.body || "新しい通知があります" }); }catch(e){}
      }
    })
    .subscribe();
}
function showToast(text){
  let t = document.createElement("div");
  t.textContent = text;
  t.style.cssText = "position:fixed;bottom:20px;right:20px;background:#111827;color:white;padding:12px 18px;border-radius:10px;z-index:50;box-shadow:0 4px 12px #0004";
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), 3500);
}

/* ---------- Boot ---------- */
sb.auth.onAuthStateChange((event) => {
  if(event === "SIGNED_IN") init();
  if(event === "PASSWORD_RECOVERY"){
    document.getElementById("authScreen").classList.add("hidden");
    document.getElementById("resetScreen").classList.remove("hidden");
  }
});
document.getElementById("resetSubmit").onclick = async () => {
  const errBox = document.getElementById("resetErr");
  const newPassword = document.getElementById("resetPassword").value;
  if(!newPassword || newPassword.length < 6){ errBox.textContent = "6文字以上のパスワードを入力してください"; return; }
  const { error } = await sb.auth.updateUser({ password: newPassword });
  if(error){ errBox.textContent = error.message; return; }
  errBox.style.color = "#065f46";
  errBox.textContent = "パスワードを更新しました。まもなくログインします…";
  setTimeout(() => location.reload(), 1500);
};
init();
</script>
